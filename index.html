<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Form Cập Nhật Nhân Viên</title>
  <style>
    body{font-family:Arial;background:#f4f4f4;padding:20px;}
    .wrap{
      background:#fff;max-width:600px;margin:auto;padding:20px;
      border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1);
    }
    label{font-weight:bold;margin-top:12px;display:block;}
    input,select,textarea{
      width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;
      border-radius:6px;box-sizing:border-box;
    }
    button{
      width:100%;padding:12px;margin-top:20px;background:#0066ff;
      border:none;color:#fff;font-size:16px;border-radius:8px;cursor:pointer;
    }
    button:hover{opacity:0.9;}
    #msg{text-align:center;margin-top:12px;font-weight:bold;}
    .success{color:#0a0;}
    .error{color:#d00;}
  </style>
</head>

<body>
<div class="wrap">
  <h2 style="text-align:center;">Cập Nhật Thông Tin Nhân Viên</h2>

  <form id="nvForm">

    <label>Họ tên *</label>
    <input id="HoTen" required/>

    <label>Mã nhân viên *</label>
    <input id="MaNV" required/>

    <label>Bộ phận *</label>
    <select id="BoPhan" required>
      <option value="">-- Chọn bộ phận --</option>
      <option>HCNS</option>
      <option>Sản xuất</option>
      <option>Kế toán</option>
      <option>Kinh doanh</option>
      <option>Kho</option>
    </select>

    <label>Chức danh</label>
    <input id="ChucDanh"/>

    <label>Điện thoại</label>
    <input id="DienThoai"/>

    <label>Email</label>
    <input id="Email" type="email"/>

    <label>Ngày sinh</label>
    <div style="display:flex;gap:10px;">
      <input id="Ngay" type="number" placeholder="DD" min="1" max="31">
      <input id="Thang" type="number" placeholder="MM" min="1" max="12">
      <input id="Nam" type="number" placeholder="YYYY" min="1950" max="2030">
    </div>

    <label>Địa chỉ</label>
    <input id="DiaChi"/>

    <label>Ghi chú</label>
    <textarea id="GhiChu" rows="3"></textarea>

    <button type="submit">Gửi dữ liệu</button>
    <div id="msg"></div>

  </form>
</div>


<script>
// ====== DÁN URL APPS SCRIPT TẠI ĐÂY ======
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMsCKh8vJBXwTJ04rjKq0-qZRK5FTqG7NTsPmkZG_U3_ZEqk4yi0bgtef87_8T7WzY5g/exec";

document.getElementById("nvForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";

  const data = {
    HoTen: HoTen.value,
    MaNV: MaNV.value,
    BoPhan: BoPhan.value,
    ChucDanh: ChucDanh.value,
    DienThoai: DienThoai.value,
    Email: Email.value,
    Ngay: Ngay.value,
    Thang: Thang.value,
    Nam: Nam.value,
    DiaChi: DiaChi.value,
    GhiChu: GhiChu.value
  };

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const rs = await res.json();
    if(rs.ok){
      msg.textContent = "✔ Gửi thành công!";
      msg.className = "success";
      nvForm.reset();
    } else {
      msg.textContent = "❌ Lỗi: " + rs.error;
      msg.className = "error";
    }
  }catch(e){
    msg.textContent = "❌ Không thể kết nối server!";
    msg.className = "error";
  }
});
</script>

</body>
</html>
